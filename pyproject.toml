[project]
name = "wohnmobil-scout"
version = "0.2.0"
description = "Wohnmobil-Suche für den gewerblichen Ankauf: Quellen, faire Bewertung, Anschreiben, Browser-App"
readme = "README.md"
requires-python = ">=3.10,<3.14"   # 3.14+ noch ohne fertige PyYAML-Pakete für Windows
dependencies = [
    "requests>=2.31,<3",
    "beautifulsoup4>=4.12,<5",
    "PyYAML>=6.0.2,<7",
    "Jinja2>=3.1,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.8,<1",
]

# Gesperrte Abhängigkeiten (feste Versionen + Prüfsummen, gültig für Windows/macOS/Linux, Python 3.10–3.13):
#   uv pip compile pyproject.toml --universal --generate-hashes --python-version 3.10 -o requirements.txt
#   uv pip compile pyproject.toml --extra dev --universal --generate-hashes --python-version 3.10 -o requirements-dev.txt

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 160   # Fachcode nutzt lange, gut lesbare Zeilen
target-version = "py310"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "B"]

[tool.ruff.lint.per-file-ignores]
"scout.py" = ["E402"]   # Paket- und Versionsprüfung muss vor den Importen laufen
