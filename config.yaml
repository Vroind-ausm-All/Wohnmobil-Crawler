# ============================================================
#  Wohnmobil-Scout – Konfiguration
#  Alle Beträge in Euro. Nach Änderungen einfach neu starten.
# ============================================================

# --- 1. Suchen ------------------------------------------------
# Tipp: Suche im Browser auf kleinanzeigen.de zusammenklicken
# (Ort, Radius, Preis, Art, "Privat"), dann die URL hier einfügen.
# Die Seiten-Nummer (seite:2, seite:3 ...) setzt das Tool selbst ein.
suchen:
  - name: Alkoven
    url: https://www.kleinanzeigen.de/s-wohnwagen-mobile/alkoven/anbieter:privat/anzeige:angebote/c220+wohnwagen_mobile.art_s:alkoven
  - name: Integrierter
    url: https://www.kleinanzeigen.de/s-wohnwagen-mobile/integrierter/anbieter:privat/anzeige:angebote/c220+wohnwagen_mobile.art_s:integrierter
  - name: Teilintegrierter
    url: https://www.kleinanzeigen.de/s-wohnwagen-mobile/teilintegrierter/anbieter:privat/anzeige:angebote/c220+wohnwagen_mobile.art_s:teilintegrierter
  - name: Kastenwagen
    url: https://www.kleinanzeigen.de/s-wohnwagen-mobile/kastenwagen/anbieter:privat/anzeige:angebote/c220+wohnwagen_mobile.art_s:kastenwagen
  - name: Sonstige / Camper
    url: https://www.kleinanzeigen.de/s-wohnwagen-mobile/andere/anbieter:privat/anzeige:angebote/c220+wohnwagen_mobile.art_s:andere
  # Wohnwagen bei Bedarf einkommentieren:
  # - name: Wohnwagen
  #   url: https://www.kleinanzeigen.de/s-wohnwagen-mobile/wohnwagen/anbieter:privat/anzeige:angebote/c220+wohnwagen_mobile.art_s:wohnwagen

# --- 2. Crawler-Verhalten -------------------------------------
crawler:
  max_seiten_pro_suche: 5        # 25 Anzeigen pro Seite
  detailseiten_pro_lauf: 60      # Detailseiten liefern km, EZ, Marke, Beschreibung
  pause_min_sek: 4               # zufällige Pause zwischen Abrufen
  pause_max_sek: 9
  timeout_sek: 25
  user_agent: "WohnmobilScout/0.1 (lokales Recherchewerkzeug; Betreiberkontakt konfigurieren)"

# --- 3. Filter ------------------------------------------------
filter:
  preis_min: 5000
  preis_max: 120000
  ez_ab_jahr: 2000               # Erstzulassung ab
  km_max: 250000
  max_entfernung_km: 0           # weiter entfernte Fahrzeuge nicht anschreiben (0 = egal)
  # Anzeigen mit diesen Begriffen werden NICHT angeschrieben
  sperrbegriffe:
    - keine händler
    - kein händler
    - händler zwecklos
    - händleranfragen zwecklos
    - keine händleranfragen
    - ohne händler
    - nur privat
    - keine gewerblichen
    - händler bitte nicht
    - vermiete
    - vermietung
    - zu vermieten
    - tausche
    - motorschaden
    - unfallschaden
    - export

# --- 4. Einkaufspreis-Rechner ---------------------------------
rechner:
  # Vergleichsangebote: gleiche Art, EZ ± jahre_toleranz, km ± km_toleranz.
  # Jeder Vergleich wird auf Alter, km und Ausstattung DIESES Fahrzeugs umgerechnet;
  # ähnlichere Fahrzeuge zählen mehr (siehe vergleich_aehnlichkeit), nähere Baujahre/km-Stände ebenso.
  vergleich_min_anzahl: 5          # ab so vielen Vergleichen gilt die Schätzung als "mittel" sicher
  vergleich_jahre_toleranz: 3
  vergleich_km_toleranz: 50000
  # Wenige Vergleiche werden zum Referenzmodell hin gemittelt:
  # Gewicht Markt = n / (n + k)  → bei k = 4: 4 Vergleiche 50 %, 12 Vergleiche 75 %, 36 Vergleiche 90 %
  vergleich_gewicht_k: 4
  # Ähnlichkeit der Vergleiche (P5-02): Gewicht je Stufe, dazu Fahrzeugklasse aus dem Text (Länge, Basisfahrzeug).
  # Fehlt der Abschnitt, gelten genau diese Werte. Ausgeschlossen wird dadurch kein Angebot – es zählt nur mehr oder weniger.
  vergleich_aehnlichkeit:
    modell: 2.5                    # gleiche Marke und gleiches Modell samt Grundriss („Sky TI 650 MEG“)
    reihe: 1.8                     # gleiche Marke und Modellreihe („Sky TI“)
    marke: 1.0                     # gleiche Marke
    klasse: 0.7                    # andere Marke derselben Markenklasse (Premium/Gehoben/Mittel = bekannte ohne Eintrag/Einstieg)
    andere: 0.5                    # andere Marke, Marke unbekannt oder nur Basisfahrzeug (Fiat, Mercedes …)
    laenge_pro_meter: 0.4          # je Meter Längenunterschied −40 % (nur wenn beide Längen genannt sind) …
    laenge_min: 0.4                # … höchstens bis auf 40 %
    basis_anders: 0.8              # anderes Basisfahrzeug (Ducato, Sprinter, Transit …; nur wenn beide genannt)
    anteil_max: 0.25               # kein einzelnes Angebot trägt mehr als 25 % des Gesamtgewichts (unter 4 Vergleichen: alle gleich)

  # Referenzmodell: Neupreis heute × Restwert nach Alter × km-Faktor × Wertfaktoren.
  # Es ist der Startwert, solange die Datenbank noch wenige Vergleiche hat –
  # danach kalibrieren die echten Angebote das Modell automatisch.
  marktmodell:
    neupreis_art:                  # typischer Neupreis heute inkl. üblicher Ausstattung
      Kastenwagen: 62000
      Teilintegrierter: 82000
      Alkoven: 76000
      Integrierter: 118000
      Wohnwagen: 30000
      Sonstige: 65000
    markenklassen:                 # nicht genannte Marken: Faktor 1,0
      - {name: Premium,  faktor: 1.35, marken: [Carthago, Concorde, Morelo, Niesmann, Frankia]}
      - {name: Gehoben,  faktor: 1.12, marken: [Hymer, Rapido, Malibu, Eura Mobil, Laika, Westfalia, Volkswagen, Bimobil, Kabe]}
      - {name: Einstieg, faktor: 0.90, marken: [Sunlight, Carado, McLouis, Rimor, Roller Team, Elnagh, Benimar, Sun Living, Etrusco, Ahorn, Weinsberg]}
    restwert:                      # Anteil vom heutigen Neupreis nach Alter in Jahren (dazwischen linear)
      0: 0.88
      1: 0.83
      2: 0.78
      3: 0.74
      5: 0.67
      7: 0.61
      10: 0.52
      12: 0.46
      15: 0.38
      20: 0.27
      25: 0.19
      30: 0.14
    km_pro_jahr_ueblich: 10000     # Laufleistung, die für das Alter "normal" ist
    km_abschlag_pro_10000: 0.015   # je 10.000 km darüber −1,5 %
    km_zuschlag_pro_10000: 0.010   # je 10.000 km darunter +1,0 %
    km_korrektur_max: 0.12         # höchstens ± 12 %
    unsicherheit_ohne_vergleich: 0.15

  # Ausstattung (+) und genannte Mängel (−) aus Titel und Beschreibung.
  # Verneinte Nennungen ("keine Feuchtigkeit", "rostfrei") zählen nicht.
  # muster = regulärer Ausdruck, passt ab Wortanfang, Groß-/Kleinschreibung egal.
  wertfaktoren:
    max_plus: 0.06
    max_minus: 0.25                # P5-05: mit Motor-/Getriebe-/Unfallschaden höher (vorher 0,15), sonst zählt ein zweiter schwerer Mangel nicht
    liste:
      - {name: Automatik,            wert: 0.030, muster: "automatik|comfort-?matic|tronic\\b|wandler"}
      - {name: Solaranlage,          wert: 0.010, muster: "solar"}
      - {name: Lithium-Batterie,     wert: 0.010, muster: "lithium|lifepo"}
      - {name: Luftfederung,         wert: 0.010, muster: "(zusatz)?luftfederung"}
      - {name: Aufbau-Klimaanlage,   wert: 0.010, muster: "dachklima|aufbauklima|klimaanlage (im|für den) (aufbau|wohnraum)"}
      - {name: Sat-Anlage,           wert: 0.005, muster: "sat-?anlage|satanlage|sat-?schüssel|oyster|teleco|kathrein"}
      - {name: Markise,              wert: 0.005, muster: "markise"}
      - {name: Rückfahrkamera,       wert: 0.005, muster: "rückfahrkamera|rueckfahrkamera"}
      - {name: Scheckheft,           wert: 0.010, muster: "scheckheft|lückenlos(e)? (wartung|service)"}
      - {name: Dichtigkeitsprüfung,  wert: 0.010, muster: "dichtigkeitsprüfung|dichtheitsprüfung|dichtigkeitsprotokoll"}
      - {name: Garagen-/Hallenplatz, wert: 0.010, muster: "garagengepflegt|garagenfahrzeug|hallenstellplatz|in (der |einer )?halle (gestanden|untergestellt)|unterstellplatz"}
      - {name: Nichtraucher,         wert: 0.005, muster: "nichtraucher"}
      - {name: Anhängerkupplung,     wert: 0.005, muster: "anhängerkupplung|anhaengerkupplung|\\bahk\\b"}
      - {name: Dieselheizung,        wert: 0.005, muster: "dieselheizung|truma combi d|combi ?d ?\\d|webasto (standheizung|dieselheizung|air ?top|thermo)|autoterm"}
      - {name: Feuchtigkeit,         wert: -0.060, muster: "feuchtigkeit(?!s(messung|prüfung|test|check|frei))|feuchte stellen|feuchtigkeitsschaden"}
      - {name: Wasserschaden,        wert: -0.080, muster: "wasserschaden|wassereintritt"}
      - {name: Undichtigkeit,        wert: -0.050, muster: "undicht"}
      - {name: Delamination,         wert: -0.080, muster: "delamin"}
      - {name: Rost,                 wert: -0.030, muster: "rost(?!schutz|frei)|durchgerostet|angerostet"}
      - {name: Hagelschaden,         wert: -0.050, muster: "hagel-?schaden|hagelschäden|hageldellen"}
      - {name: HU abgelaufen,        wert: -0.030, muster: "(tüv|hu) (ist )?abgelaufen|ohne (tüv|hu)\\b|kein (tüv|hu)\\b"}
      - {name: Defekt genannt,       wert: -0.040, muster: "defekt"}
      - {name: Reparaturbedarf,      wert: -0.060, muster: "reparaturbedürftig|an bastler|für bastler|bastlerfahrzeug"}
      - {name: Motorschaden,         wert: -0.150, muster: "motorschaden|motor (ist )?(kaputt|defekt)|kolbenfresser|(zylinderkopfdichtung|zkd) (ist )?(kaputt|defekt|durch)"}
      - {name: Getriebeschaden,      wert: -0.100, muster: "getriebeschaden|getriebe (ist )?(kaputt|defekt)|kupplung (ist )?(kaputt|defekt)"}
      - {name: Unfallschaden,        wert: -0.080, muster: "unfallschaden|unfallfahrzeug|unfallwagen|hatte einen unfall"}

  # Privat-Angebotspreise liegen über dem, was am Ende gezahlt wird
  abschlag_angebot_auf_privatwert: 0.07
  # Händler-Verkaufspreis liegt über Privatwert (Gewährleistung, Aufbereitung, Finanzierung)
  aufschlag_haendler_vk: 0.10
  # P5-05: Mängelrisiko – genannte Mängel senken den Wert (Wertfaktoren); ihr Ausmaß ist unklar, deshalb reicht die untere Spanne
  # um die Summe der Mängelabzüge weiter nach unten, höchstens so weit. 0 = aus.
  maengelrisiko_max: 0.15
  abschlag_marke_unbekannt: 0.05  # Aufbaumarke unbekannt (nur „Wohnmobil“ oder nur Fiat/Mercedes …): Händler-VK 5 % niedriger, mit Hinweis
  # Händlermarkt (P5-04): vergleichbare gewerbliche Angebote (gleiche Auswahl und Gewichte wie oben) begrenzen den Händler-VK –
  # teurer als vergleichbare Händler kann ein Händler nicht verkaufen. Erst ab haendler_vergleich_min Händlerangeboten.
  haendler_vk_deckel: true
  haendler_vergleich_min: 3
  abschlag_haendler_angebot: 0.05  # Händler-Angebotspreis → Abschluss (Verhandlung beim Händler)

  kosten:
    aufbereitung: 900
    hu_gasprüfung: 350
    standkosten_pro_monat: 120
    standzeit_monate: 3
    # Abholung: Grundpauschale + € je km Fahrstrecke (Sprit, Fahrer, Rückreise).
    # Die Entfernung wird aus deiner PLZ (anschreiben → plz) und der PLZ der Anzeige geschätzt.
    transport_grundpauschale: 80
    transport_pro_km: 0.90
    transport_pauschal: 300           # wenn die Entfernung unbekannt ist
    gewährleistung_rücklage_prozent: 0.025   # vom Händler-VK (gilt, wenn keine Staffel eingetragen ist)
    # P5-05: Gewährleistungsrücklage nach Alter – ältere Fahrzeuge haben mehr Sachmängelfälle
    gewaehrleistung_staffel:
      - {bis_jahre: 5,  prozent: 0.020}
      - {bis_jahre: 10, prozent: 0.025}
      - {bis_jahre: 15, prozent: 0.035}
      - {bis_jahre: 99, prozent: 0.045}
    # P5-05: Saisonzuschlag zur Standzeit nach Kaufmonat (Monat: zusätzliche Monate) – im Herbst gekauft, im Frühjahr verkauft
    standzeit_saison_zuschlag: {9: 1, 10: 2, 11: 2, 12: 1, 1: 1}
    # P5-05: Kapitalbindung über die Standzeit; gebundenes Kapital ≈ Anteil vom Händler-VK (Einkauf + Kosten). 0 = aus.
    kapitalzins_jahr: 0.05
    kapital_anteil_vk: 0.8
    # Reparaturrisiko nach Fahrzeugalter (Jahre bis)
    reparatur_risiko:
      - {bis_jahre: 5,  betrag: 500}
      - {bis_jahre: 10, betrag: 1500}
      - {bis_jahre: 15, betrag: 2500}
      - {bis_jahre: 99, betrag: 4000}
    km_zuschlag_ab: 100000            # ab diesem km-Stand ...
    km_zuschlag_pro_10000: 250        # ... je weitere 10.000 km

  ziel_marge_prozent: 0.12          # Netto-Gewinn vom Händler-VK
  ziel_marge_min: 2500
  # Differenzbesteuerung §25a UStG: USt nur auf die Marge (19/119)
  differenzbesteuerung: true
  # Erstes Angebot an den Verkäufer = Max-EK × Faktor (Verhandlungsspielraum) ...
  erstangebot_faktor: 0.92
  # ... aber nie unter diesem Anteil vom Marktwert privat (kein Lockangebot).
  # Liegt sogar der Max-EK darunter, wird der Max-EK angeboten. 0 = aus.
  fair_untergrenze_privatwert: 0.75
  # Bewertung: Angebotspreis / Max-EK
  ampel:
    gruen_bis: 1.10    # Verkäufer will max. 10 % mehr als wir zahlen können
    gelb_bis: 1.25

# --- 5. Anschreiben -------------------------------------------
anschreiben:
  vorlage: vorlagen/anschreiben.txt
  firma: "Muster Reisemobile GmbH"
  ansprechpartner: "Max Mustermann"
  telefon: "0711 123456"
  ort: "Stuttgart"
  plz: "70173"                     # dein Standort – für Entfernung und Abholkosten
  # Nur Anzeigen mit dieser Ampel oder besser bekommen ein Anschreiben
  ab_ampel: gelb

# --- 6. Nachfassen ---------------------------------------------
# Kontaktierte Fahrzeuge erscheinen unter "Nachfassen", wenn nach so vielen Tagen
# noch keine Antwort eingetragen ist – oder sofort, wenn der Verkäufer den Preis senkt.
nachfassen:
  nach_tagen: 3
  max_anzahl: 1                    # so oft wird höchstens nachgefasst (Preissenkungen zählen extra)
  vorlage: vorlagen/nachfassen.txt

# Verfügbarkeit (P3-04): Ein Inserat, das so viele Tage nicht mehr bestätigt wurde (gesehen in Suche, Seite, Mail, Text), wird beim Anzeigen als
# „vermutlich offline“ gekennzeichnet. Gespeichert wird das nicht; das Anschreiben bleibt möglich, es erscheint nur ein Hinweis.
verfuegbarkeit:
  offline_nach_tagen: 14           # ganze Zahl 1 bis 3650; ungültige Werte gelten als 14

# Neuigkeiten (P4-03): frisch eingegangene Inserate und deutliche Preissenkungen werden hervorgehoben (Filter „Neu & gesenkt“, Sortierung
# „Neuigkeiten zuerst“), nach dem Suchlauf im Browser-Hinweis und in der Mail gemeldet. Ganz oben steht, was durch eine Senkung jetzt unter
# dem Max-EK liegt. Die Bewertung ändert sich dadurch nicht. Ungültige Werte gelten als Standard.
neuigkeiten:
  frisch_stunden: 48               # so lange gilt ein Inserat nach dem ersten Eingang als neu (1–1440)
  senkung_tage: 14                 # so lange wird eine Preissenkung hervorgehoben (1–365)
  senkung_min_prozent: 3           # deutlich ist eine Senkung ab so viel Prozent …
  senkung_min_euro: 500            # … oder ab so viel Euro

# --- 7. App -----------------------------------------------------
app:
  port: 8765
  auto_suche_stunden: 0            # standardmäßig AUS: unfreigegebene Web-Quelle darf nicht automatisch laufen
  auto_suche_von: 7                # nur zwischen 7 und 21 Uhr
  auto_suche_bis: 21
  # Statusseite /status (P4-04): Für die automatische Suche und geplante Aufgaben („scout.py lauf“) gilt je Quelle ein Mindestabstand
  # zwischen zwei Abrufen; nach einer Sperre der Quelle (HTTP 403/429, Captcha) wird so lange pausiert. Von Hand gestartete Läufe und
  # „scout.py lauf --sofort“ warten nicht. Beispiel: intervall_stunden_je_quelle: {kleinanzeigen: 6}
  intervall_stunden_je_quelle: {}
  pause_nach_sperre_stunden: 24    # 0 = keine Pause
  # Handy-App fürs Team (docs/HANDY-APP.md): Adresse, unter der die App per Tailscale erreichbar ist,
  # z. B. "https://buero-pc.tail1234.ts.net". Wird in WhatsApp-Nachrichten verlinkt und als Host freigegeben.
  oeffentliche_url: ""
  erlaubte_hosts: []               # weitere Hostnamen, über die die App erreichbar sein darf
  # Härtung (Phase G0, docs/PILOTBETRIEB.md). Bremse gegen Passwort-Raten: Fehlversuche je Gerät+Name bzw. je Gerät.
  login_max_fehlversuche: 5
  login_max_fehlversuche_je_ip: 20
  login_sperre_minuten: 15
  vertrauter_proxy: false          # true NUR hinter eigenem Reverse-Proxy: dann zählen X-Forwarded-For/-Proto
  nur_https: false                 # true, wenn die App nur über HTTPS erreichbar ist: Anmelde-Cookie immer „Secure“
  live_max_je_nutzer: 4            # Live-Aktualisierung (SSE): offene Verbindungen je Zugang und insgesamt
  live_max_gesamt: 40
  sitzung_leerlauf_stunden: 72     # nach so vielen Stunden ohne Nutzung neu anmelden (0 = aus); spätestens nach 30 Tagen

# Datenschutz – Aufbewahrungsfristen (P1-14a, F10, docs/DATENRECHTE.md). Fachliche Annahmen, keine Rechtsberatung: vor dem Pilotbetrieb
# mit Datenschutzbeauftragtem/Steuerberatung abstimmen. 0 = aus. Bericht: python scout.py datenschutz; ausführen: … --ausfuehren --bestaetigt
# (vorher wird die Datenbank gesichert). Gekaufte Fahrzeuge und Kaufunterlagen werden nie automatisch gelöscht.
datenschutz:
  inserate_anonymisieren_nach_monaten: 6          # Inserate ohne Kauf nach letzter Aktivität: Anbietername, Anschreiben, Notiz, Besichtigung;
                                                  # abgelegte Mails, gespeicherte Seiten und Diagnose-Rohseiten werden gelöscht
  verkaufsanfragen_anonymisieren_nach_monaten: 12 # Verkaufsanfragen ohne Ankauf nach letzter Änderung (wie ein Widerruf, Status bleibt)
  sitzungen_loeschen_nach_tagen: 30               # abgelaufene Anmeldungen
  audit_loeschen_nach_monaten: 24                 # Audit-Protokoll (Nutzer, IP, Zugriffe)
  ankauf_aufbewahren_jahre: 10                    # Kaufunterlagen ab Ende des Kalenderjahres – danach nur melden (§ 147 AO / § 257 HGB)
  automatisch: nur_bericht                        # nur_bericht = beim Start und nach Läufen nur melden (Statusseite, Protokoll); nach Prüfung
                                                  # des ersten Berichts „ja“ = dort automatisch anwenden (vorher je Tag eine Sicherung)

# Mandantenbetrieb (G2, docs/MANDANTEN.md): mehrere Firmen auf einem Server, je eigene Datenbank. Nur mit
# „python scout.py app --mandanten“; sonst ohne Wirkung.
mandanten:
  ordner: mandanten                # je Mandant ein Unterordner mit mandant.yaml (relativ zum Projektordner)

# --- 7b. Team ---------------------------------------------------
# Gilt nur, wenn Nutzer angelegt sind (python scout.py nutzer anlegen …). Wer ein Inserat übernimmt, reserviert es für
# die eingestellte Zeit; danach ist es wieder frei, solange noch kein Kontakt bestätigt wurde.
team:
  reservierung_tage: 2             # 0 = Reservierungen laufen nie ab

# --- 8. WhatsApp ------------------------------------------------
# Ohne Einrichtung: In der App gibt es "Per WhatsApp senden"-Knöpfe (öffnen WhatsApp mit fertigem Text).
# Automatische Nachrichten brauchen die offizielle WhatsApp Business Platform (Cloud API) von Meta:
# Business-Konto, Telefonnummer, freigegebene Nachrichtenvorlagen (Kosten pro Nachricht). docs/HANDY-APP.md
whatsapp:
  aktiv: false
  phone_number_id: ""                 # aus dem Meta-Entwicklerportal
  token_env: SCOUT_WHATSAPP_TOKEN     # Zugriffstoken als Umgebungsvariable, nicht hier eintragen
  api_version: v23.0                  # aktuelle Version im Meta-Portal prüfen
  sprache: de
  vorlage_neue_treffer: neue_treffer             # Vorlage mit 2 Platzhaltern: Anzahl, bestes Fahrzeug
  vorlage_zuweisung: besichtigung_zugewiesen     # Vorlage mit 3 Platzhaltern: Fahrzeug, Termin, Adresse
  empfaenger_treffer: []              # Nummern für neue Treffer, z. B. ["+491701234567"]

# --- 8b. Eingänge schaltbar (P2-04, ADR-036) ---------------------
# Wege, auf denen Anzeigen ohne Portalabruf in den Scout kommen. Ausgeschaltet wird nichts gelesen; Dateien bleiben liegen.
# Pull-Quellen des Suchlaufs (Kleinanzeigen …) werden NICHT hier geschaltet: Freigabe steht im Code (Nutzungsrechte,
# docs/SOURCES.md), Ein/Aus mit "python scout.py quellen an|aus KENNUNG"; Übersicht: "python scout.py quellen liste".
eingaenge:
  seiten: {aktiv: true}            # im Browser gespeicherte Seiten (Ordner "import", siehe unten)
  text: {aktiv: true}              # URL + eingefügter Text (P2-05)
  email: {aktiv: false}            # E-Mail-Suchagenten (P2-06): Benachrichtigungen als .eml in import/email/ legen (Thunderbird: Speichern
                                   # unter, Webmail: als .eml herunterladen); einschalten mit 'aktiv: true', einlesen mit 'python scout.py import --mails'
                                   # oder dem Knopf in der App. Verlinkte Anzeigen werden nie abgerufen; Absender/Empfänger/Betreff werden nicht gespeichert.
                                   # Abgelegte Mails (eingelesen/nicht_erkannt/fehlerhaft) löscht die Datenschutz-Frist (datenschutz → inserate_anonymisieren_nach_monaten).

# --- 9. Gespeicherte Seiten einlesen ---------------------------
# Kleinanzeigen-Seiten selbst im Browser öffnen und mit Strg+S („Webseite, nur HTML“)
# in diesen Ordner speichern. "python scout.py import" bzw. der Knopf in der App liest sie ein –
# ohne Internetabruf. Eingelesene Dateien landen danach in import/eingelesen/<Datum>/.
import:
  ordner: import                   # relativ zum Projektordner (oder vollständiger Pfad)

# --- 10. Ausgabe & Benachrichtigung ----------------------------
ausgabe:
  ordner: ausgabe
  datenbank: daten/anzeigen.sqlite
  wal: true                      # SQLite-WAL: App und Suchlauf lesen/schreiben parallel; false, wenn die Datenbank auf einem Netzlaufwerk liegt

# Datensicherung: python scout.py sichern / wiederherstellen <Datei> --bestaetigt
# (automatisch auch vor jeder Datenbank-Migration). Älteste eigene Sicherungen werden gelöscht.
sicherung:
  ordner: daten/sicherungen
  behalten: 10                   # so viele Sicherungen bleiben erhalten

email:
  aktiv: false
  smtp_server: smtp.gmail.com
  smtp_port: 587
  benutzer: "dein.name@example.de"
  passwort_env: SCOUT_SMTP_PASSWORT     # Passwort als Umgebungsvariable, nicht hier
  empfaenger: "dein.name@example.de"
  nur_bei_neuen_treffern: true
  preissenkungen_melden: true      # deutliche Preissenkungen seit dem Suchlauf mitmelden (P4-03)

# Verkäuferportal (Phase B): Verkäufer bieten ihr Fahrzeug selbst an (/verkaufen), das Team bearbeitet es unter /anfragen.
# Version 1 läuft nur in der App (lokal/Tailscale) – öffentlich erst nach eigener Sicherheitsprüfung (ADR-025).
verkaeuferportal:
  spanne_zeigen: true                # grobe Marktwert-Spanne nach dem Absenden (nie Max-EK oder Angebot)
  spanne_mindest_sicherheit: mittel  # nur bei Datenlage „mittel“ oder „hoch“
  einwilligung_version: "2026-10-entwurf-2" # Stand des Einwilligungstexts (2: + freiwillige Weitergabe an Standorte); bei jeder Textänderung erhöhen

# Demo-Auktionen (Phase D, ADR-027): nur Demo, nichts ist verbindlich; einen Zuschlag bestätigt ausschließlich der Inhaber.
# Bieten dürfen nur geprüfte Standorte auf Anfragen mit Zustimmung des Verkäufers und Freigabe durch den Inhaber.
auktion:
  laufzeit_stunden: 24          # Standard beim Start; je Auktion änderbar innerhalb der Grenzen
  laufzeit_min_stunden: 1
  laufzeit_max_stunden: 168
  schritt: 100                  # Mindestabstand zum Höchstgebot in ganzen Euro
  verlaengerung_minuten: 2      # Gebot in den letzten N Minuten verlängert die Auktion auf N Minuten ab dem Gebot
  startpreis_anteil: 0.7        # Startpreis-Vorschlag = Anteil der Preisvorstellung (abgerundet auf den Schritt)

# Deal Intelligence (Phase E, ADR-028): Gewinn und Max-EK zum Gebotsbetrag, jede gespeicherte Kalkulation nachrechenbar.
kalkulation:
  provision_prozent: 0.02       # Provision/Gebühr vom Zuschlag (0.02 = 2 %), als Kosten im Max-EK enthalten; 0 = keine
