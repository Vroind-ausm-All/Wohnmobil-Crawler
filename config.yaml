# ============================================================
#  Wohnmobil-Scout – Konfiguration
#  Alle Beträge in Euro. Nach Änderungen einfach neu starten.
# ============================================================

# --- 1. Suchen ------------------------------------------------
# Tipp: Suche im Browser auf kleinanzeigen.de zusammenklicken
# (Ort, Radius, Preis, Art, "Privat"), dann die URL hier einfügen.
# Die Seiten-Nummer (seite:2, seite:3 ...) setzt das Tool selbst ein.
suchen:
  - name: Alkoven
    url: https://www.kleinanzeigen.de/s-wohnwagen-mobile/alkoven/anbieter:privat/anzeige:angebote/c220+wohnwagen_mobile.art_s:alkoven
  - name: Integrierter
    url: https://www.kleinanzeigen.de/s-wohnwagen-mobile/integrierter/anbieter:privat/anzeige:angebote/c220+wohnwagen_mobile.art_s:integrierter
  - name: Teilintegrierter
    url: https://www.kleinanzeigen.de/s-wohnwagen-mobile/teilintegrierter/anbieter:privat/anzeige:angebote/c220+wohnwagen_mobile.art_s:teilintegrierter
  - name: Kastenwagen
    url: https://www.kleinanzeigen.de/s-wohnwagen-mobile/kastenwagen/anbieter:privat/anzeige:angebote/c220+wohnwagen_mobile.art_s:kastenwagen
  - name: Sonstige / Camper
    url: https://www.kleinanzeigen.de/s-wohnwagen-mobile/andere/anbieter:privat/anzeige:angebote/c220+wohnwagen_mobile.art_s:andere
  # Wohnwagen bei Bedarf einkommentieren:
  # - name: Wohnwagen
  #   url: https://www.kleinanzeigen.de/s-wohnwagen-mobile/wohnwagen/anbieter:privat/anzeige:angebote/c220+wohnwagen_mobile.art_s:wohnwagen

# --- 2. Crawler-Verhalten -------------------------------------
crawler:
  max_seiten_pro_suche: 5        # 25 Anzeigen pro Seite
  detailseiten_pro_lauf: 60      # Detailseiten liefern km, EZ, Marke, Beschreibung
  pause_min_sek: 4               # zufällige Pause zwischen Abrufen
  pause_max_sek: 9
  timeout_sek: 25
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0 Safari/537.36"

# --- 3. Filter ------------------------------------------------
filter:
  preis_min: 5000
  preis_max: 120000
  ez_ab_jahr: 2000               # Erstzulassung ab
  km_max: 250000
  max_entfernung_km: 0           # weiter entfernte Fahrzeuge nicht anschreiben (0 = egal)
  # Anzeigen mit diesen Begriffen werden NICHT angeschrieben
  sperrbegriffe:
    - keine händler
    - kein händler
    - händler zwecklos
    - händleranfragen zwecklos
    - keine händleranfragen
    - ohne händler
    - nur privat
    - keine gewerblichen
    - händler bitte nicht
    - vermiete
    - vermietung
    - zu vermieten
    - tausche
    - motorschaden
    - unfallschaden
    - export

# --- 4. Einkaufspreis-Rechner ---------------------------------
rechner:
  # Vergleichsangebote: gleiche Art, EZ ± jahre_toleranz, km ± km_toleranz.
  # Jeder Vergleich wird auf Alter, km und Ausstattung DIESES Fahrzeugs umgerechnet;
  # gleiche Marke zählt doppelt, nähere Baujahre/km-Stände mehr.
  vergleich_min_anzahl: 5          # ab so vielen Vergleichen gilt die Schätzung als "mittel" sicher
  vergleich_jahre_toleranz: 3
  vergleich_km_toleranz: 50000
  # Wenige Vergleiche werden zum Referenzmodell hin gemittelt:
  # Gewicht Markt = n / (n + k)  → bei k = 4: 4 Vergleiche 50 %, 12 Vergleiche 75 %, 36 Vergleiche 90 %
  vergleich_gewicht_k: 4

  # Referenzmodell: Neupreis heute × Restwert nach Alter × km-Faktor × Wertfaktoren.
  # Es ist der Startwert, solange die Datenbank noch wenige Vergleiche hat –
  # danach kalibrieren die echten Angebote das Modell automatisch.
  marktmodell:
    neupreis_art:                  # typischer Neupreis heute inkl. üblicher Ausstattung
      Kastenwagen: 62000
      Teilintegrierter: 82000
      Alkoven: 76000
      Integrierter: 118000
      Wohnwagen: 30000
      Sonstige: 65000
    markenklassen:                 # nicht genannte Marken: Faktor 1,0
      - {name: Premium,  faktor: 1.35, marken: [Carthago, Concorde, Morelo, Niesmann, Frankia]}
      - {name: Gehoben,  faktor: 1.12, marken: [Hymer, Rapido, Malibu, Eura Mobil, Laika, Westfalia, Volkswagen, Bimobil, Kabe]}
      - {name: Einstieg, faktor: 0.90, marken: [Sunlight, Carado, McLouis, Rimor, Roller Team, Elnagh, Benimar, Sun Living, Etrusco, Ahorn, Weinsberg]}
    restwert:                      # Anteil vom heutigen Neupreis nach Alter in Jahren (dazwischen linear)
      0: 0.88
      1: 0.83
      2: 0.78
      3: 0.74
      5: 0.67
      7: 0.61
      10: 0.52
      12: 0.46
      15: 0.38
      20: 0.27
      25: 0.19
      30: 0.14
    km_pro_jahr_ueblich: 10000     # Laufleistung, die für das Alter "normal" ist
    km_abschlag_pro_10000: 0.015   # je 10.000 km darüber −1,5 %
    km_zuschlag_pro_10000: 0.010   # je 10.000 km darunter +1,0 %
    km_korrektur_max: 0.12         # höchstens ± 12 %
    unsicherheit_ohne_vergleich: 0.15

  # Ausstattung (+) und genannte Mängel (−) aus Titel und Beschreibung.
  # Verneinte Nennungen ("keine Feuchtigkeit", "rostfrei") zählen nicht.
  # muster = regulärer Ausdruck, passt ab Wortanfang, Groß-/Kleinschreibung egal.
  wertfaktoren:
    max_plus: 0.06
    max_minus: 0.15
    liste:
      - {name: Automatik,            wert: 0.030, muster: "automatik|comfort-?matic|tronic\\b|wandler"}
      - {name: Solaranlage,          wert: 0.010, muster: "solar"}
      - {name: Lithium-Batterie,     wert: 0.010, muster: "lithium|lifepo"}
      - {name: Luftfederung,         wert: 0.010, muster: "(zusatz)?luftfederung"}
      - {name: Aufbau-Klimaanlage,   wert: 0.010, muster: "dachklima|aufbauklima|klimaanlage (im|für den) (aufbau|wohnraum)"}
      - {name: Sat-Anlage,           wert: 0.005, muster: "sat-?anlage|satanlage|sat-?schüssel|oyster|teleco|kathrein"}
      - {name: Markise,              wert: 0.005, muster: "markise"}
      - {name: Rückfahrkamera,       wert: 0.005, muster: "rückfahrkamera|rueckfahrkamera"}
      - {name: Scheckheft,           wert: 0.010, muster: "scheckheft|lückenlos(e)? (wartung|service)"}
      - {name: Dichtigkeitsprüfung,  wert: 0.010, muster: "dichtigkeitsprüfung|dichtheitsprüfung|dichtigkeitsprotokoll"}
      - {name: Garagen-/Hallenplatz, wert: 0.010, muster: "garagengepflegt|garagenfahrzeug|hallenstellplatz|in (der |einer )?halle (gestanden|untergestellt)|unterstellplatz"}
      - {name: Nichtraucher,         wert: 0.005, muster: "nichtraucher"}
      - {name: Feuchtigkeit,         wert: -0.060, muster: "feuchtigkeit(?!s(messung|prüfung|test|check|frei))|feuchte stellen|feuchtigkeitsschaden"}
      - {name: Wasserschaden,        wert: -0.080, muster: "wasserschaden|wassereintritt"}
      - {name: Undichtigkeit,        wert: -0.050, muster: "undicht"}
      - {name: Delamination,         wert: -0.080, muster: "delamin"}
      - {name: Rost,                 wert: -0.030, muster: "rost(?!schutz|frei)|durchgerostet|angerostet"}
      - {name: Hagelschaden,         wert: -0.050, muster: "hagel-?schaden|hagelschäden|hageldellen"}
      - {name: HU abgelaufen,        wert: -0.030, muster: "(tüv|hu) (ist )?abgelaufen|ohne (tüv|hu)\\b|kein (tüv|hu)\\b"}
      - {name: Defekt genannt,       wert: -0.040, muster: "defekt"}
      - {name: Reparaturbedarf,      wert: -0.060, muster: "reparaturbedürftig|an bastler|für bastler|bastlerfahrzeug"}

  # Privat-Angebotspreise liegen über dem, was am Ende gezahlt wird
  abschlag_angebot_auf_privatwert: 0.07
  # Händler-Verkaufspreis liegt über Privatwert (Gewährleistung, Aufbereitung, Finanzierung)
  aufschlag_haendler_vk: 0.10

  kosten:
    aufbereitung: 900
    hu_gasprüfung: 350
    standkosten_pro_monat: 120
    standzeit_monate: 3
    # Abholung: Grundpauschale + € je km Fahrstrecke (Sprit, Fahrer, Rückreise).
    # Die Entfernung wird aus deiner PLZ (anschreiben → plz) und der PLZ der Anzeige geschätzt.
    transport_grundpauschale: 80
    transport_pro_km: 0.90
    transport_pauschal: 300           # wenn die Entfernung unbekannt ist
    gewährleistung_rücklage_prozent: 0.025   # vom Händler-VK
    # Reparaturrisiko nach Fahrzeugalter (Jahre bis)
    reparatur_risiko:
      - {bis_jahre: 5,  betrag: 500}
      - {bis_jahre: 10, betrag: 1500}
      - {bis_jahre: 15, betrag: 2500}
      - {bis_jahre: 99, betrag: 4000}
    km_zuschlag_ab: 100000            # ab diesem km-Stand ...
    km_zuschlag_pro_10000: 250        # ... je weitere 10.000 km

  ziel_marge_prozent: 0.12          # Netto-Gewinn vom Händler-VK
  ziel_marge_min: 2500
  # Differenzbesteuerung §25a UStG: USt nur auf die Marge (19/119)
  differenzbesteuerung: true
  # Erstes Angebot an den Verkäufer = Max-EK × Faktor (Verhandlungsspielraum) ...
  erstangebot_faktor: 0.92
  # ... aber nie unter diesem Anteil vom Marktwert privat (kein Lockangebot).
  # Liegt sogar der Max-EK darunter, wird der Max-EK angeboten. 0 = aus.
  fair_untergrenze_privatwert: 0.75
  # Bewertung: Angebotspreis / Max-EK
  ampel:
    gruen_bis: 1.10    # Verkäufer will max. 10 % mehr als wir zahlen können
    gelb_bis: 1.25

# --- 5. Anschreiben -------------------------------------------
anschreiben:
  vorlage: vorlagen/anschreiben.txt
  firma: "Muster Reisemobile GmbH"
  ansprechpartner: "Max Mustermann"
  telefon: "0711 123456"
  ort: "Stuttgart"
  plz: "70173"                     # dein Standort – für Entfernung und Abholkosten
  # Nur Anzeigen mit dieser Ampel oder besser bekommen ein Anschreiben
  ab_ampel: gelb

# --- 6. Nachfassen ---------------------------------------------
# Kontaktierte Fahrzeuge erscheinen unter "Nachfassen", wenn nach so vielen Tagen
# noch keine Antwort eingetragen ist – oder sofort, wenn der Verkäufer den Preis senkt.
nachfassen:
  nach_tagen: 3
  max_anzahl: 1                    # so oft wird höchstens nachgefasst (Preissenkungen zählen extra)
  vorlage: vorlagen/nachfassen.txt

# --- 7. App -----------------------------------------------------
app:
  port: 8765
  auto_suche_stunden: 3            # sucht automatisch, solange die App offen ist (0 = aus)
  auto_suche_von: 7                # nur zwischen 7 und 21 Uhr
  auto_suche_bis: 21
  # Handy-App fürs Team (docs/HANDY-APP.md): Adresse, unter der die App per Tailscale erreichbar ist,
  # z. B. "https://buero-pc.tail1234.ts.net". Wird in WhatsApp-Nachrichten verlinkt und als Host freigegeben.
  oeffentliche_url: ""
  erlaubte_hosts: []               # weitere Hostnamen, über die die App erreichbar sein darf

# --- 8. WhatsApp ------------------------------------------------
# Ohne Einrichtung: In der App gibt es "Per WhatsApp senden"-Knöpfe (öffnen WhatsApp mit fertigem Text).
# Automatische Nachrichten brauchen die offizielle WhatsApp Business Platform (Cloud API) von Meta:
# Business-Konto, Telefonnummer, freigegebene Nachrichtenvorlagen (Kosten pro Nachricht). docs/HANDY-APP.md
whatsapp:
  aktiv: false
  phone_number_id: ""                 # aus dem Meta-Entwicklerportal
  token_env: SCOUT_WHATSAPP_TOKEN     # Zugriffstoken als Umgebungsvariable, nicht hier eintragen
  api_version: v23.0                  # aktuelle Version im Meta-Portal prüfen
  sprache: de
  vorlage_neue_treffer: neue_treffer             # Vorlage mit 2 Platzhaltern: Anzahl, bestes Fahrzeug
  vorlage_zuweisung: besichtigung_zugewiesen     # Vorlage mit 3 Platzhaltern: Fahrzeug, Termin, Adresse
  empfaenger_treffer: []              # Nummern für neue Treffer, z. B. ["+491701234567"]

# --- 9. Gespeicherte Seiten einlesen ---------------------------
# Kleinanzeigen-Seiten selbst im Browser öffnen und mit Strg+S („Webseite, nur HTML“)
# in diesen Ordner speichern. "python scout.py import" bzw. der Knopf in der App liest sie ein –
# ohne Internetabruf. Eingelesene Dateien landen danach in import/eingelesen/<Datum>/.
import:
  ordner: import                   # relativ zum Projektordner (oder vollständiger Pfad)

# --- 10. Ausgabe & Benachrichtigung ----------------------------
ausgabe:
  ordner: ausgabe
  datenbank: daten/anzeigen.sqlite

# Datensicherung: python scout.py sichern / wiederherstellen <Datei> --bestaetigt
# (automatisch auch vor jeder Datenbank-Migration). Älteste eigene Sicherungen werden gelöscht.
sicherung:
  ordner: daten/sicherungen
  behalten: 10                   # so viele Sicherungen bleiben erhalten

email:
  aktiv: false
  smtp_server: smtp.gmail.com
  smtp_port: 587
  benutzer: "dein.name@example.de"
  passwort_env: SCOUT_SMTP_PASSWORT     # Passwort als Umgebungsvariable, nicht hier
  empfaenger: "dein.name@example.de"
  nur_bei_neuen_treffern: true
